# multigravity configuration example

[daemon]
# Cooldown settings for rate limited workers (429 / RESOURCE_EXHAUSTED)
cooldown_base_s = 5.0
cooldown_cap_s = 300.0

# Queue deadline: maximum time a task can wait in queue before failing with NO_WORKER_AVAILABLE
queue_deadline_s = 60.0

# Per-task execution timeout: maximum time allowed for a single worker attempt
task_timeout_s = 120.0

# Maximum retry attempts across workers before failing with TASK_FAILED
max_attempts = 3

# Default character cap for the compressed JSON result
default_max_output_chars = 4000

# Worker execution adapter: "agy_cli" (default for real use) or "fake" (for testing)
adapter = "agy_cli"

# Persistence & logging paths
log_dir = "logs"
journal_dir = "journals"

# Unix domain socket path (defaults to $XDG_RUNTIME_DIR/multigravity.sock if empty)
# socket_path = "~/.multigravity/multigravity.sock"

# Worker configurations (Strict boundary: 1 to 3 background accounts; Account 1 is main agent)
# You can run with 1, 2, or 3 background workers.
#
# If you only have two worker accounts (Accounts 2 & 3), you can either:
#   1. Set `enabled = false` on worker-3, OR
#   2. Remove the [[workers]] block for worker-3 entirely.
#
# A disabled worker is shown as DISABLED in status, is never probed, is never offered
# for login, and does not block the wizard from completing or the daemon from starting.
# To add the third worker later: set `enabled = true` and run `multigravity login worker-3`.

[[workers]]
id = "worker-1"
label = "Account 2 (Research & Docs)"
profile_dir = "~/.multigravity/workers/worker-1"
enabled = true
concurrency = 1

[[workers]]
id = "worker-2"
label = "Account 3 (Test Gen & Review)"
profile_dir = "~/.multigravity/workers/worker-2"
enabled = true
concurrency = 1

[[workers]]
id = "worker-3"
label = "Account 4 (General Background)"
profile_dir = "~/.multigravity/workers/worker-3"
enabled = false
concurrency = 1
